- name: coo_lite
  switch: { key: coo_lite.apply, value: '1' }
  table: events
  column: at
  where: kind = 'coo_lite'
  gap: 2d
- name: fixer
  switch: { key: fixer.mode, value: live }
  table: runs
  column: at
  where: seat = 'fixer'
  gap: 2d
- name: fix_mode
  table: runs
  column: at
  where: mode = 'fix'
  gap: 7d
- name: brief_writer
  table: runs
  column: at
  where: seat = 'brief_writer'
  gap: 1d
- name: text_review
  table: runs
  column: at
  where: seat = 'text_review'
  gap: 2d
- name: growth_lead
  table: runs
  column: at
  where: seat = 'growth_lead'
  gap: 7d
- name: web_specialist
  table: runs
  column: at
  where: seat = 'web_specialist'
  while: EXISTS (SELECT 1 FROM plans WHERE origin GLOB 'https://github.com/caliperforge/atelier-web/*')
- name: gardener
  table: gardens
  column: day
  gap: 2d
  while: >-
    EXISTS (SELECT 1 FROM pipes p WHERE p.name = 'internal' AND p.enabled = 1
    AND (SELECT count(*) < p.max_concurrent AND coalesce(min(priority), 9) > 2 FROM plans
    WHERE pipe_id = p.id AND state IN ('queued', 'running')))
    AND (SELECT count(*) FROM gardens g JOIN tickets t ON g.url = 'https://github.com/' || t.repo || '/issues/' || t.number
    WHERE t.closed_at IS NULL) < 2
- name: ratchet
  table: events
  column: at
  where: kind = 'ratchet'
  gap: 7d
- name: accounts
  table: accounts
  column: measured_at
  gap: 7d
- name: records
  table: records
  column: read_at
  gap: 1d
- name: dispositions
  table: dispositions
  column: id
- name: signoffs
  table: events
  column: at
  where: kind = 'signoff'
  gap: 7d
- name: proposals
  table: approvals
  column: approved_at
  where: subject_kind = 'proposal'
  while: EXISTS (SELECT 1 FROM proposals WHERE state = 'open')
- name: ratchet_refuse
  switch: { key: ratchet.mode, value: refuse }
- name: intake
  table: plans
  column: queued_at
  where: template IN ('pr_path', 'research', 'comms')
  gap: 1d
  while: EXISTS (SELECT 1 FROM pipes WHERE enabled = 1)
- name: stuck_plans
  gap: 1h
- name: science_pull
  table: events
  column: at
  where: kind = 'science_pull' AND outcome = 'pass'
  gap: 7d
- name: site_publish
  table: desk_posts
  column: published_at
  where: status = 'published'
  gap: 14d
- name: director_look
  table: events
  column: at
  where: kind = 'look'
  gap: 7d
- name: daily_learnings
  table: desk_learnings
  column: date
  where: json_array_length(items) > 0
  gap: 2d
  while: EXISTS (SELECT 1 FROM pipes WHERE name = 'comms' AND enabled = 1)
