- name: swift_review
  table: runs
  column: at
  where: staffed = 'swift_specialist' AND mode = 'review'
  while: EXISTS (SELECT 1 FROM plans p JOIN plan_files f ON f.plan = p.id WHERE p.step > 4 AND f.stray = 0 AND f.path GLOB '*.swift' AND (p.state NOT IN ('done', 'refused', 'halted') OR EXISTS (SELECT 1 FROM runs r WHERE r.plan = p.id AND julianday(r.at) >= julianday($since))))
  gap: 7d
