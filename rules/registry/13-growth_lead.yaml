- name: growth_lead
  table: runs
  column: at
  where: seat = 'growth_lead'
  gap: 7d
  while: EXISTS (SELECT 1 FROM plans WHERE template = 'comms' AND (title GLOB 'growth *' OR title GLOB 'weekly *') AND step >= 7 AND queued_at >= $since)
- name: growth_packet_empty
  table: events
  column: at
  where: "kind = 'gather' AND message = '0 landed, 0 refused' AND plan IN (SELECT id FROM plans WHERE title GLOB 'growth *')"
  gap: 7d
  expected: 0
