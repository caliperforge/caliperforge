- name: weakened_ruled
  table: events
  column: at
  where: "kind = 'rails' AND message LIKE 'test-weakened%' AND EXISTS (SELECT 1 FROM events e WHERE e.plan = events.plan AND e.kind IN ('ruling', 'park') AND e.actor IN ('coo', 'director') AND julianday(e.at) < julianday(events.at))"
  gap: 7d
  expected: 0
