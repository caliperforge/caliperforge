- name: greptile_every_head
  table: events
  column: at
  where: "kind = 'ready' AND outcome = 'pass' AND (message GLOB '*; Greptile gave no score in *' OR message GLOB '*; Greptile skipped: *' OR message GLOB '*is not asked again*')"
  gap: 7d
  expected: 0
- name: greptile_silent
  table: events
  column: at
  where: "kind = 'greptile.silent'"
  gap: 14d
  expected: 0
