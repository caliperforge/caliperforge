  gap: 7d
  expected: 0
- name: director_design_waive
  table: events
  column: at
  where: "kind = 'review' AND outcome = 'refuse' AND message GLOB 'design*' AND EXISTS (SELECT 1 FROM events w WHERE w.plan = events.plan AND w.kind = 'director' AND w.outcome = 'pass' AND w.message GLOB 'waive:*' AND w.id < events.id)"
  gap: 7d
  expected: 0
- name: gpg_lock_hold
  table: events
  column: at
  where: "outcome = 'escalate' AND message LIKE '%gpg waited on a key database lock%'"
  gap: 7d
  expected: 0
- name: bench_no_properties
  table: events
  column: at
  where: "kind = 'generate' AND outcome = 'pass' AND message LIKE '%, 0 properties'"
  gap: 7d
  expected: 0
- name: fork_actions_off
  table: events
  column: at
  where: "outcome = 'escalate' AND message LIKE '%has Actions off for its workflows%' AND julianday(events.at) < julianday('now', '-1 day') AND NOT EXISTS (SELECT 1 FROM events n WHERE n.plan = events.plan AND n.id > events.id AND julianday(n.at) <= julianday(events.at, '+1 day') AND (n.kind = 'return' OR (n.kind = 'ready' AND n.outcome = 'pass')))"
  gap: 7d
  expected: 0
- name: director_repeat_return
  switch: { key: director.apply, value: '1' }
  table: events
  column: at
  where: "kind = 'stuck' AND outcome = 'needs_coo'"
  gap: 7d
  expected: 0
- name: fork_unrun
  table: events
  column: at
  where: "kind = 'ci.unrun' AND (outcome <> 'pass' OR EXISTS (SELECT 1 FROM events u WHERE u.plan = events.plan AND u.kind = 'ci.unrun' AND u.pointer = events.pointer AND u.id < events.id))"
  gap: 7d
  expected: 0
- name: refile_carries
  switch: { key: director.apply, value: '1' }
  table: events
  column: at
