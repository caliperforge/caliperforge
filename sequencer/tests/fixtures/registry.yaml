# drift files at most 3 tickets a day; the rest show in cf brief as not filed (cap)
- name: director
  switch: { key: director.apply, value: '1' }
  table: events
  column: at
  where: kind IN ('director', 'coo_lite')
  gap: 2d
- name: fixer
  switch: { key: fixer.mode, value: live }
  table: events
  column: at
  where: actor = 'fixer'
  gap: 2d
- name: fix_mode
  table: runs
  column: at
  where: mode = 'fix'
  gap: 7d
- name: swift_review
  table: runs
  column: at
  where: seat = 'swift_specialist' AND mode = 'review'
  when: SELECT 1 FROM plans p JOIN plan_files f ON f.plan = p.id WHERE p.step > 4 AND f.stray = 0 AND f.path GLOB '*.swift'
  gap: 7d
- name: kotlin_review
  table: runs
  column: at
  where: seat = 'kotlin_specialist' AND mode = 'review'
  when: SELECT 1 FROM plans p JOIN plan_files f ON f.plan = p.id WHERE p.step > 4 AND f.stray = 0 AND (f.path GLOB '*.kt' OR f.path GLOB '*.kts')
  gap: 7d
- name: python_review
  table: runs
  column: at
  where: seat = 'python_specialist' AND mode = 'review'
  when: SELECT 1 FROM plans p JOIN plan_files f ON f.plan = p.id WHERE p.step > 4 AND f.stray = 0 AND f.path GLOB '*.py' AND p.queued_at >= $since
  gap: 7d
- name: ruby_review
  table: runs
  column: at
  where: seat = 'ruby_specialist' AND mode = 'review'
  when: SELECT 1 FROM plans p JOIN plan_files f ON f.plan = p.id WHERE p.step > 4 AND f.stray = 0 AND f.path GLOB '*.rb'
  gap: 7d
- name: rust_review
  table: runs
  column: at
  where: seat = 'rust_specialist' AND mode = 'review'
  when: SELECT 1 FROM plans p JOIN plan_files f ON f.plan = p.id WHERE p.step > 4 AND f.stray = 0 AND f.path GLOB '*.rs' AND p.queued_at >= $since
  gap: 7d
- name: go_review
  table: runs
  column: at
  where: seat = 'go_specialist' AND mode = 'review'
  when: SELECT 1 FROM plans p JOIN plan_files f ON f.plan = p.id WHERE p.step > 4 AND f.stray = 0 AND f.path GLOB '*.go'
  gap: 7d
- name: php_review
  table: runs
  column: at
  where: seat = 'php_specialist' AND mode = 'review'
  when: SELECT 1 FROM plans p JOIN plan_files f ON f.plan = p.id WHERE p.step > 4 AND f.stray = 0 AND f.path GLOB '*.php'
  gap: 7d
- name: typescript_review
  table: runs
  column: at
  where: seat = 'typescript_specialist' AND mode = 'review'
  gap: 7d
- name: brief_writer
  table: runs
  column: at
  where: seat = 'brief_writer'
  gap: 1d
- name: text_review
  table: runs
  column: at
  where: seat = 'text_review'
  gap: 2d
- name: writer_log
  table: runs
  column: at
  where: seat = 'writer' AND mode = 'log'
  gap: 2d
  while: EXISTS (SELECT 1 FROM pipes WHERE name = 'comms' AND enabled = 1)
- name: writer_ship
  table: runs
  column: at
  where: seat = 'writer' AND mode = 'ship'
  when: SELECT 1 FROM plans WHERE template = 'comms' AND title GLOB 'ship *'
- name: writer_weekly
  table: runs
  column: at
  where: seat = 'writer' AND mode = 'weekly'
  gap: 7d
  while: EXISTS (SELECT 1 FROM pipes WHERE name = 'comms' AND enabled = 1)
- name: growth_lead
  table: runs
  column: at
  where: seat = 'growth_lead'
  gap: 7d
  while: EXISTS (SELECT 1 FROM plans WHERE template = 'comms' AND (title GLOB 'growth *' OR title GLOB 'weekly *') AND step >= 7 AND queued_at >= $since)
- name: web_specialist
  table: runs
  column: at
  where: seat = 'web_specialist'
  while: EXISTS (SELECT 1 FROM plans WHERE origin GLOB 'https://github.com/caliperforge/atelier-web/*' AND state IN ('queued', 'running', 'blocked_on_ceo') AND queued_at >= $since)
- name: design
  table: runs
  column: at
  where: seat = 'design'
  while: EXISTS (SELECT 1 FROM plans WHERE origin GLOB 'https://github.com/caliperforge/atelier-web/*' AND step > 4)
- name: go_specialist
  table: runs
  column: at
  where: seat = 'go_specialist' AND mode = 'build'
  when: SELECT 1 FROM plans p JOIN plan_files f ON f.plan = p.id WHERE p.step > 2 AND f.stray = 0 AND f.path GLOB '*.go'
- name: php_specialist
  table: runs
  column: at
  where: seat = 'php_specialist' AND mode = 'build'
  when: SELECT 1 FROM plans p JOIN plan_files f ON f.plan = p.id WHERE p.step > 2 AND f.stray = 0 AND f.path GLOB '*.php'
- name: ruby_specialist
  table: runs
  column: at
  where: seat = 'ruby_specialist' AND mode = 'build'
  when: SELECT 1 FROM plans p JOIN plan_files f ON f.plan = p.id WHERE p.step > 2 AND f.stray = 0 AND f.path GLOB '*.rb'
- name: python_specialist
  table: runs
  column: at
  where: seat = 'python_specialist'
- name: lua_specialist
  table: runs
  column: at
  where: seat = 'lua_specialist'
  when: SELECT 1 FROM plans p JOIN plan_files f ON f.plan = p.id WHERE p.step > 2 AND f.stray = 0 AND f.path GLOB '*.lua' AND p.queued_at >= $since
- name: rust_specialist
  table: runs
  column: at
  where: seat = 'rust_specialist'
- name: gardener
  table: gardens
  column: day
  gap: 2d
  while: >-
    EXISTS (SELECT 1 FROM pipes p WHERE p.name = 'internal' AND p.enabled = 1
    AND (SELECT count(*) < p.max_concurrent AND coalesce(min(priority), 9) > 2 FROM plans
    WHERE pipe_id = p.id AND state IN ('queued', 'running')))
    AND (SELECT count(*) FROM gardens g JOIN tickets t ON g.url = 'https://github.com/' || t.repo || '/issues/' || t.number
    WHERE t.closed_at IS NULL) < 2
- name: ratchet
  table: events
  column: at
  where: kind = 'ratchet'
  gap: 7d
- name: accounts
  table: accounts
  column: measured_at
  gap: 7d
- name: records
  table: records
  column: read_at
  gap: 1d
- name: dispositions
  table: dispositions
  column: id
- name: signoffs
  table: events
  column: at
  where: kind = 'signoff'
  gap: 7d
- name: proposals
  table: approvals
  column: approved_at
  where: subject_kind = 'proposal'
  while: EXISTS (SELECT 1 FROM proposals WHERE state = 'open')
- name: ratchet_refuse
  switch: { key: ratchet.mode, value: refuse }
- name: intake
  table: plans
  column: queued_at
  where: template IN ('pr_path', 'research', 'comms')
  gap: 1d
  while: EXISTS (SELECT 1 FROM pipes WHERE enabled = 1)
- name: stuck_plans
  gap: 1h
- name: science_pull
  table: events
  column: at
  where: kind = 'science_pull' AND outcome = 'pass'
  gap: 7d
- name: site_publish
  table: desk_posts
  column: published_at
  where: status = 'published'
  gap: 14d
- name: director_look
  table: events
  column: at
  where: kind = 'look'
  gap: 7d
- name: typescript_specialist
  table: runs
  column: at
  where: seat = 'typescript_specialist'
  gap: 2d
  while: EXISTS (SELECT 1 FROM pipes WHERE name = 'internal' AND enabled = 1)
- name: daily_learnings
  table: desk_learnings
  column: date
  where: json_array_length(items) > 0
  gap: 2d
  while: EXISTS (SELECT 1 FROM pipes WHERE name = 'comms' AND enabled = 1)
- name: review_examples
  table: events
  column: at
  where: kind = 'examples.learned'
  gap: 7d
- name: director_fix_reach
  table: events
  column: at
  where: kind IN ('director', 'coo_lite') AND message LIKE 'fix did not apply%'
  gap: 7d
  expected: 0
- name: tick_deps
  evidence: .cf/deps.lock.sha matches main's package-lock.json
  gap: 0h
# launchd/com.caliperforge.watch.plist runs cli/watch-main.ts
- name: watch
- name: director_widen
  table: decisions
  column: at
  where: verb = 'widen'
  while: EXISTS (SELECT 1 FROM events WHERE kind = 'director' AND outcome = 'pass' AND message GLOB 'widen:*')
- name: target_parked_once
  evidence: events rows with kind = 'measure' AND message GLOB 'target_parked:*', at most one per plan per park
- name: director_ceiling
  table: decisions
  column: at
  where: verb = 'ask_ceo' AND wait_reason = 'token_ceiling'
- name: close_landed
  table: events
  column: at
  where: kind = 'close' AND message GLOB 'landed [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]*'
- name: handback_not_done
  table: verdicts
  column: id
  where: rail_id = 'completion-audit' AND outcome = 'refuse' AND message LIKE '%Not done%'
  expected: 0
- name: ruling_files
  table: events
  column: at
  where: kind = 'files' AND actor = 'ruling' AND outcome = 'pass'
- name: needs_ceo_actor
  table: events
  column: at
  where: outcome = 'needs_ceo' AND actor <> 'coo'
  gap: 7d
  expected: 0
- name: build_cap
  table: events
  column: at
  where: kind = 'build_cap'
  when: SELECT 1 FROM events e WHERE e.kind = 'build' AND e.run IS NOT NULL AND julianday(e.at) > julianday('now', '-1 day') AND (SELECT count(*) FROM events b WHERE b.plan = e.plan AND b.kind = 'build' AND b.run IS NOT NULL AND b.id < e.id) >= 5
- name: ready_proof_stuck
  table: events
  column: at
  where: "kind = 'stuck' AND message LIKE '%waits: ready_proof%'"
  gap: 7d
  expected: 0
- name: card_facts
  table: events
  column: at
  where: "kind = 'card_facts' AND outcome = 'refuse'"
  gap: 7d
  expected: 0
- name: director_findings
  table: events
  column: at
  where: "kind = 'director' AND plan IS NULL AND pointer LIKE 'finding %'"
  gap: 2d
  while: EXISTS (SELECT 1 FROM drift_findings WHERE closed_at IS NULL AND julianday(found_at) < julianday($since, '+1 day'))
- name: director_rule_dropped
  table: events
  column: at
  where: kind = 'director' AND message LIKE 'rule did not apply, the answer names a path%'
  gap: 7d
  expected: 0
- name: rule_to_build
  table: events
  column: at
  where: "kind = 'director' AND message LIKE '%builder takes it%' AND NOT EXISTS (SELECT 1 FROM runs WHERE runs.plan = events.plan AND runs.step = 2 AND runs.seat NOT IN ('fixer', 'orchestrator', 'coo_lite', 'director') AND julianday(runs.at) BETWEEN julianday(events.at) AND julianday(events.at, '+1 day'))"
  gap: 7d
  expected: 0
